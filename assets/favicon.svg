<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#080c14" />
  <rect x="2" y="2" width="96" height="96" rx="18" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>
  <!-- I & W Tech Monogram -->
  <path d="M 22 28 L 32 28 M 27 28 L 27 72 M 22 72 L 32 72" stroke="url(#grad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 40 28 L 49 72 L 58 42 L 67 72 L 76 28" fill="none" stroke="url(#grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Circuit Nodes -->
  <circle cx="27" cy="28" r="3" fill="#00f2fe"/>
  <circle cx="27" cy="72" r="3" fill="#00f2fe"/>
  <circle cx="58" cy="42" r="3.5" fill="#00f2fe"/>
</svg>
